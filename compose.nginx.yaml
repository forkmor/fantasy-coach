services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HARNESS_PUBLIC_URL: https://${FIELDHOUSE_DOMAIN:?Set FIELDHOUSE_DOMAIN in .env}
      HARNESS_PASSWORD_HASH: ${HARNESS_PASSWORD_HASH:?Run deploy/generate-config.py}
      HARNESS_VAULT_KEY: ${HARNESS_VAULT_KEY:?Run deploy/generate-config.py}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - fieldhouse-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fieldhouse-data:
